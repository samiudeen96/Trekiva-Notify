name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: notify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notify -d notify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only database; the claim tests need a real PostgreSQL for the unique constraint.
      DATABASE_URL: postgresql://notify:ci-password@localhost:5432/notify?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
